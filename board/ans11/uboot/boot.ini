# U-Boot boot configuration for ANS11 (RK3326)
# Based on ROCKNIX & ArkOS4Clone legacy bootloader
ODROIDGO2-UBOOT-CONFIG

# CPU frequency (privacy: slightly throttled for battery/thermals)
setenv max_cpufreq "1200"
setenv boot_cpufreq "1100"
setenv max_ddrfreq "666"

# Privacy kernel parameters
setenv bootargs "console=tty1 quiet loglevel=2 root=LABEL=CRYPT3X rootwait fbcon=rotate:0 fbcon=primary:0 max_cpufreq=${max_cpufreq} boot_cpufreq=${boot_cpufreq} max_ddrfreq=${max_ddrfreq} cgroup_disable=memory swapaccount=0"

# Load kernel & device tree
load mmc 1:1 0x02000000 Image
load mmc 1:1 0x01f00000 rk3326-ans11.dtb

# Boot kernel with device tree
booti 0x02000000 - 0x01f00000
