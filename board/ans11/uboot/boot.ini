/dts-v1/;

#include <dt-bindings/gpio/gpio.h>
#include <dt-bindings/pinctrl/rockchip.h>

/ {
    model = "CRYPT3X ANS11";
    compatible = "crypt3x,ans11", "rockchip,rk3326";
    #address-cells = <1>;
    #size-cells = <1>;

    chosen {
        bootargs = "console=tty1 quiet loglevel=2 crypt3x.privacy=1 crypt3x.vault=1";
    };

    cpus {
        #address-cells = <1>;
        #size-cells = <0>;
        cpu-map {
            cluster0 {
                core0 { cpu = <&cpu0>; };
            };
        };

        cpu0: cpu@0 {
            device_type = "cpu";
            compatible = "arm,cortex-a35";
            reg = <0>;
            enable-method = "psci";
        };
    };

    display: panel {
        compatible = "simple-panel";
        backlight = <&backlight>;
        status = "okay";
    };

    backlight: backlight {
        compatible = "pwm-backlight";
        pwms = <&pwm0 0 25000>;
        brightness-levels = <0 32 64 96 128 160 192 224 255>;
        default-brightness-level = <7>;
        status = "okay";
    };

    gpio_keys {
        compatible = "gpio-keys";
        power {
            label = "Power";
            gpios = <&gpio3 RK_PC5 GPIO_ACTIVE_LOW>;
            linux,code = <KEY_POWER>;
            wakeup-source;
        };
    };
};

&pwm0 {
    status = "okay";
};

&gpio3 {
    status = "okay";
};

&uart2 {
    status = "okay";
};
