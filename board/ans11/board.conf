#!/bin/bash
# ANS11 Hardware Profile — RK3326 / RK3326S
# Source this file to set device-specific variables

export BOARD_NAME="ANS11"
export SOC="RK3326"
export PROCESSOR="Cortex-A35 (1.5 GHz quad-core)"
export RAM_MB=2048
export STORAGE_TYPE="eMMC"
export KERNEL_VERSION="4.4.y"
export KERNEL_ARCH="arm64"
export BOOTLOADER="u-boot"
export DTB_DEFAULT="rk3326-ans11.dtb"
export DISPLAY_TYPE="LCD"
export DISPLAY_RESOLUTION="720x480"
export AUDIO_CODEC="default"
export WIFI_MODULE="rtl8188eu"
export BT_MODULE="hciuart"
export USB_MODE="otg"
export POWER_LED_GPIO="yes"
export BATTERY_MONITORING="yes"
export CHARGE_CONTROL="yes"
export THERMAL_THROTTLE="yes"

# Privacy-specific flags
export DISABLE_TELEMETRY=1
export DISABLE_CLOUD_SYNC=1
export ENABLE_VPN_DEFAULT=1
export ENABLE_DNS_PRIVACY=1
export ENCRYPTED_KEYSTORE=1
export VAULT_LOCK_ON_BOOT=1
export DURESS_PIN_ENABLED=1

# Build flags
export CRYPT3X_LITE=1
export PRIVACY_MODE="strict"
export IMAGE_SIZE_GIB=8
export TARGET_CARD_SIZE_GIB=32

# Derived paths
export DTB_DIR="board/ans11/dtb"
export OVERLAY_DIR="board/ans11/overlays"
export UBOOT_DIR="board/ans11/uboot"
export KERNEL_CONFIG="board/ans11/kernel.config"
